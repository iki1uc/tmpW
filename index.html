}
.text-\[var\(--dim\)\]{
  color: var(--dim);
}
.text-\[var\(--gold\)\]{
  color: var(--gold);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--magenta\)\]{
  color: var(--magenta);
}
.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}
.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.duration-300{
  transition-duration: 300ms;
}
:root {
  --bg: #05070a;
  --surface: #090e15;
  --surface-2: #0c1421;
  --line: #1b2839;
  --gold: #d4af37;
  --gold-soft: #9a8138;
  --cyan: #00e5ff;
  --magenta: #ff00aa;
  --ink: #e9eff6;
  --dim: #8fa5bb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04060a;
    --surface: #080d14;
    --surface-2: #0b1220;
    --line: #1b2839;
    --gold: #d4af37;
    --gold-soft: #9a8138;
    --cyan: #00e5ff;
    --magenta: #ff00aa;
    --ink: #e9eff6;
    --dim: #8fa5bb;
  }
}
html,
body {
  background: var(--bg);
}
body {
  font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color: var(--ink);
}
.font-mono-x {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* --- SVG / UI animations --- */
@keyframes planePulse {
  0%,
  100% {
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
}
@keyframes haloPulse {
  0% {
    transform: scale(0.55);
    opacity: 0.75;
  }
  100% {
    transform: scale(2.1);
    opacity: 0;
  }
}
@keyframes dashFlow {
  to {
    stroke-dashoffset: -26;
  }
}
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes gateGlow {
  0%,
  100% {
    opacity: 0.35;
  }
  50% {
    opacity: 0.8;
  }
}
.plane-pulse {
  animation: planePulse 4.5s ease-in-out infinite;
}
.node-halo {
  transform-box: fill-box;
  transform-origin: center;
  animation: haloPulse 2.8s ease-out infinite;
}
.route-line {
  stroke-dasharray: 7 6;
  animation: dashFlow 1.1s linear infinite;
}
.fade-up {
  animation: fadeUp 0.45s ease both;
}
.gate-door {
  transition: transform 0.85s cubic-bezier(0.7, 0, 0.2, 1);
}
.gate-glow {
  animation: gateGlow 3.2s ease-in-out infinite;
}
.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}
.hover\:text-\[var\(--ink\)\]:hover{
  color: var(--ink);
}
.disabled\:cursor-wait:disabled{
  cursor: wait;
}
.disabled\:opacity-50:disabled{
  opacity: 0.5;
}
@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }
  .sm\:p-5{
    padding: 1.25rem;
  }
  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-\[13px\]{
    font-size: 13px;
  }
  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 1024px){
  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_400px\]{
    grid-template-columns: minmax(0,1fr) 400px;
  }
}
